<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Increment Upsell / Downsell Calculator</title>
<style>
:root{--bg:#eef2f6;--card:#fff;--ink:#14212e;--mute:#5d6b7a;--line:#d5dde6;--acc:#0b6e69;--accbg:#e1f2f0;--neg:#b3261e;--negbg:#fbe9e7}
@media (prefers-color-scheme:dark){:root{--bg:#0f1720;--card:#18232f;--ink:#e8eef4;--mute:#93a3b3;--line:#2a3948;--acc:#4fd1c5;--accbg:#173a3a;--neg:#ff8a80;--negbg:#3b1f1d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px 16px}
main{max-width:560px;margin:0 auto}
h1{font-size:1.4rem;margin:0 0 16px}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tab{flex:1;margin:0;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:10px;font:inherit;font-weight:600;cursor:pointer}
.tab[aria-selected="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
.down .tab[aria-selected="true"]{background:var(--neg);border-color:var(--neg);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:block;font-size:.85rem;color:var(--mute);margin-bottom:4px}
input,select{width:100%;font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.err{color:var(--neg);font-size:.9rem;margin-top:10px;min-height:1.2em}
ol{list-style:none;margin:0;padding:0}
li{padding:12px 0;border-bottom:1px solid var(--line)}
li:last-child{border:0}
li b{display:block}
.f{color:var(--mute);font-size:.9rem;font-variant-numeric:tabular-nums}
.r{font-weight:700;font-variant-numeric:tabular-nums}
.final{background:var(--accbg);border-radius:8px;padding:14px;margin-top:12px;font-size:1.15rem}
.down .final{background:var(--negbg);color:var(--neg)}
</style>
</head>
<body>
<main id="app">
<h1>Increment Calculator</h1>
<div class="tabs" role="tablist">
  <button class="tab" role="tab" id="t-up" aria-selected="true" type="button">Upsell</button>
  <button class="tab" role="tab" id="t-down" aria-selected="false" type="button">Downsell</button>
</div>
<div class="card">
  <div class="grid">
    <div><label for="a">Base value</label><input id="a" type="number" step="any" value="26557.09"></div>
    <div><label for="b" id="bl">Upsell value</label><input id="b" type="number" step="any" value="7398.92"></div>
    <div><label for="rate">Increment rate</label>
      <select id="rate"><option value="5">5%</option><option value="10">10%</option></select></div>
    <div><label for="tax">Tax (%)</label><input id="tax" type="number" step="any" value="10"></div>
    <div><label for="mo">Months in year</label><input id="mo" type="number" min="1" value="12"></div>
    <div><label for="rem">Remaining months</label><input id="rem" type="number" min="1" value="3"></div>
  </div>
  <div class="err" id="err" role="alert"></div>
</div>
<div class="card" id="out" hidden><ol id="steps"></ol><div class="final" id="final"></div></div>
</main>
<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var mode="up";
  var fmt=function(n,d){return n.toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d})};
  var r2=function(n){return Math.round((n+Number.EPSILON)*100)/100};
  function setMode(m){
    mode=m;
    $("t-up").setAttribute("aria-selected",m==="up");
    $("t-down").setAttribute("aria-selected",m==="down");
    $("app").className=m==="down"?"down":"";
    $("bl").textContent=m==="up"?"Upsell value":"Downsell value";
    calc();
  }
  function calc(){
    var a=parseFloat($("a").value),b=parseFloat($("b").value),rate=parseFloat($("rate").value),
        tax=parseFloat($("tax").value),mo=parseInt($("mo").value,10),rem=parseInt($("rem").value,10);
    var err=$("err");err.textContent="";
    if([a,b,rate,tax,mo,rem].some(isNaN)||mo<1||rem<1){err.textContent="Fill in every field with valid numbers (months must be at least 1).";$("out").hidden=true;return}
    var sign=mode==="down"?-1:1;
    var label=mode==="down"?"Downsell":"Upsell";
    var diff=a-b;
    var base=sign*diff*rate/100;
    var monthly=r2(base/mo);
    var remaining=r2(monthly*rem);
    var taxAmt=r2(remaining*tax/100);
    var total=r2(remaining+taxAmt);
    var inv=r2(total/rem);
    var rows=[
      ["Base value ("+rate+"% "+label.toLowerCase()+")",(sign<0?"−":"")+"("+fmt(a,2)+" − "+fmt(b,2)+") × "+rate+"%",fmt(base,4)],
      ["Monthly "+label.toLowerCase()+" value",fmt(base,4)+" ÷ "+mo,fmt(monthly,2)+" per month"],
      ["Value for remaining "+rem+" months",fmt(monthly,2)+" × "+rem,fmt(remaining,2)],
      ["Add tax ("+tax+"%)",fmt(remaining,2)+" + ("+fmt(taxAmt,2)+")",fmt(total,2)],
      ["Monthly "+(mode==="down"?"credit":"invoice")+" amount",fmt(total,2)+" ÷ "+rem,fmt(inv,2)+" per month"]
    ];
    $("steps").innerHTML=rows.map(function(x,i){
      return "<li><b>"+(i+1)+". "+x[0]+"</b><span class='f'>"+x[1]+" = </span><span class='r'>"+x[2]+"</span></li>";
    }).join("");
    $("final").innerHTML="Monthly "+(mode==="down"?"credit":"invoice")+": <b>"+fmt(inv,2)+"</b>";
    $("out").hidden=false;
  }
  $("t-up").addEventListener("click",function(){setMode("up")});
  $("t-down").addEventListener("click",function(){setMode("down")});
  ["a","b","rate","tax","mo","rem"].forEach(function(i){$(i).addEventListener("input",calc)});
  calc();
})();
</script>
</body>
</html>
